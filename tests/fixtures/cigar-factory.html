<div class="dialog" id="dialog_cigarfactory_factory" style="display: none; z-index: 2;">  <div data-tip="Close" onclick="close_dialog('cigarfactory_factory');" class="close"></div>  <div class="title double">    <h1>Cigar Factory</h1>    <h2>Factory</h2>    <div class="icon" onclick="play_sound('common_click',0.7); show_dialog('cigarfactory',true,'',true);"></div>  </div>  <div class="main">    <div class="mobile_overview scrollable">    <div class="generator">      <div class="generator_details">         <div class="generate_amount"><div class="icon_tobacco"></div><div class="amount" data-weight="3">3 KG</div></div>              <span class="seperator">=</span>          <div class="generate_amount_cigars"><div class="icon_cigars_small"></div><div class="amount" data-number="180">180</div></div>      </div>            <div class="timedetail generate_time">        <p>          <b>Time to Generate:</b>          <i>02H 30M</i>        </p>      </div>            <div class="text_extra">Select additives:</div>            <div class="extrasupplement">                   <select class="select2 supplement_type" onchange="eval($(this).find('option:selected').attr('data-onclick'));" style="width: 180px">           <option value="normal">None</option>                       <option value="weed">Weed (18 KG)</option>                      <option value="meth">Meth  (18 KG)</option>                    <option value="xtc">XTC  (18 KG)</option>                    </select>      </div>          <div class="buttons_wide">        <div class="button produce" onclick="if (!check_timers(1,$(this))) return; cmd('cigarfactory:startgenerate',{'supplement':$('#dialog_cigarfactory_factory .supplement_type').val()},true);">Generate</div>        <div style="display: none" class="button diamonds finishit" onclick="if (!check_diamonds($(this).find('i.buyoff').data('diamonds'),$(this))) return; play_sound('remove_waiting_time',0.7); cmd('cigarfactory:generatefinishit','',true);"><span>Finish now</span><i class="buyoff"></i></div>      </div>    </div>        <div class="items">              <div class="cigarbox" data-tip="Weed cigar"><div class="icon_cigars weed"></div><div class="amount_right">X <span class="num_amount">83</span></div></div>              <div class="cigarbox" data-tip="XTC cigar"><div class="icon_cigars xtc"></div><div class="amount_right">X <span class="num_amount">180</span></div></div>          </div>        <div class="offer">      <div class="title_offer">Offer:</div>      <div class="icon_cigars weed"></div>      <div class="offer_amount">58</div>                  <div class="offer_offer cash"></div><div class="label label_cash" data-number="270860" data-positions="6">270&nbsp;860</div>                <div class="family_share">Extra family share:</div>        <div class="family_label label_cash" data-number="18212" data-positions="6">18&nbsp;212</div>    </div>    <div class="offer_details">       <div class="timedetail">        <p>          <b>Valid for:</b>          <i class="data_countdown" data-countdown="true" data-cdtimer="9312" data-cmdzero="cigarfactory:offerexpired">02H 35M</i>        </p>      </div>     <div class="buttons_wide">        <div class="button yes" onclick="cmd('cigarfactory:acceptoffer','',true);">Accept</div>     </div>    </div>    </div>        <div data-tip="View info" class="info_bottom_icon" onclick="show_info_dialog('cigarfactory_factory_info','','Cigar Factory','You can generate cigars in your Factory. Regularly customers will come and buy your cigars and some customers will want something extra. &lt;br /&gt;&lt;br /&gt;Special buyers might offer something special, let the business flow. Don\'t let your customers wait for too long, because offers are only valid for a limited time.&lt;br /&gt;&lt;br /&gt;You will need a certain amount of tobacco or other extra\'s to be able to start generating cigars. &lt;br /&gt;&lt;br /&gt;Followers will influence the price on your cigar offers.','Ok','close_dialog(\'info\');','','','','',false,true,true);"></div>          <div class="tobaccostatus"><div class="value">0.00 KG/6 KG</div></div>      <div class="cigarsstatus"><div class="value">263/275</div></div>  </div>  <script>      $('#imperium #cigarfactory .collect').attr('class','collect cigar weed').show();      </script></div>
